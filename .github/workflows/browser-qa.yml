name: Studio browser QA
on:
  workflow_dispatch:
    inputs:
      stress:
        description: Include optional 19,990-plant stress scene
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - index.html
      - 'studio-*.js'
      - 'plant-models/**'
      - 'qa/**'
      - '.github/workflows/browser-qa.yml'
  pull_request:
    paths:
      - index.html
      - 'studio-*.js'
      - 'plant-models/**'
      - 'qa/**'
      - '.github/workflows/browser-qa.yml'
permissions:
  contents: read
concurrency:
  group: studio-browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate and run real browser checks
        env:
          QA_STRESS: ${{ inputs.stress && '1' || '0' }}
        run: |
          node --check qa/browser-smoke.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/studio-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node qa/browser-smoke.mjs
      - name: Upload QA results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-qa
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14
